<!DOCTYPE html>
<html>

<head>
    <title>Odoo Support Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap and FontAwesome CDN -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <style>
        #support .card:hover {
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        #support h4 {
            font-size: 1.75rem;
        }

        .support-icon {
            font-size: 2rem;
            color: #ff9931;
        }

        .support-link {
            color: #333;
            text-decoration: none;
        }

        .support-link:hover {
            text-decoration: underline;
            color: #ff9931;
        }
    </style>
</head>

<body>

<!-- Header -->
<div id="loempia_tabs" class="container">
    <div class="row justify-content-md-between justify-content-center border-bottom align-items-center py-2 mx-0">
        <div class="col-auto mt-md-0 mt-4 mb-3 mb-lg-0">
            <span class="btn btn-sm mb-2 mb-lg-0 p-2"
                  style="font-size: 14px; font-weight: 500;background-color: #ff9931;color:#fff;">
                <i class="fa fa-check"></i> Community
            </span>
            <span class="btn btn-sm mb-2 mb-lg-0 p-2"
                  style="font-size: 14px; font-weight: 500;background-color: #ff9931;color:#fff;">
                <i class="fa fa-check"></i> Enterprise
            </span>
            <span class="btn btn-sm mb-2 mb-lg-0 p-2"
                  style="font-size: 14px; font-weight: 500;background-color: #ff9931;color:#fff;">
                <i class="fa fa-check"></i> Odoo.sh
            </span>
        </div>
    </div>
</div>

<!-- Support Section -->
<section id="support" class="py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 text-center">
                <h4 class="font-weight-bold mb-3">Need Help or Support?</h4>
                <p class="text-muted">Feel free to reach out to us if you encounter any issues or have questions.</p>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-sm-6 col-md-4 mb-3">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body text-center">
                        <i class="fa fa-phone support-icon mb-3"></i>
                        <h6 class="font-weight-bold">Call Us</h6>
                        <a href="tel:+923010400131" class="support-link">+92 301 0400131</a>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-4 mb-3">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body text-center">
                        <i class="fa fa-envelope support-icon mb-3"></i>
                        <h6 class="font-weight-bold">Email Us</h6>
                        <a href="mailto:fawadh817@gmail.com" class="support-link">fawadh817@gmail.com</a>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-4 mb-3">
                <div class="card shadow-sm h-100 border-0">
                    <div class="card-body text-center">
                        <i class="fa fa-clock-o support-icon mb-3"></i>
                        <h6 class="font-weight-bold">Support Hours</h6>
                        <p class="mb-0">Mon to Fri (9AM to 10PM (PKT)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Configurations Section with Images -->
<section id="md_tab" style="padding-top: 50px;background-color: transparent;">
    <div class="">
        <div class="tab-content" style="padding-top: 30px;background-color: transparent;padding-bottom: 30px;">
            <div id="Configurations" class="tab-pane active">
                <section id="md_configuration">
                    <div class="container">
                        <div class="text-center">
                            <div class="col-md-12">
                                <img class="img-responsive rounded shadow" src="1.png" style="width: 100%;" />
                            </div>
                            <br/>
                            <div class="col-md-12">
                                <img class="img-responsive rounded shadow" src="2.png" style="width: 100%;" />
                            </div>
                            <br/>
                            <div class="col-md-12">
                                <img class="img-responsive rounded shadow" src="3.png" style="width: 100%;" />
                            </div>
                            <br/>
                            <div class="col-md-12">
                                <img class="img-responsive rounded shadow" src="4.png" style="width: 100%;" />
                            </div>
                            <br/>
                            <div class="col-md-12">
                                <img class="img-responsive rounded shadow" src="5.png" style="width: 100%;" />
                            </div>
                            <br/>
                            <div class="col-md-12">
                                <img class="img-responsive rounded shadow" src="6.png" style="width: 100%;" />
                            </div>
                            <br/>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
</section>

</body>

</html>
